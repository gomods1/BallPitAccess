# Publishes a release when a version tag is pushed. Stage it first:
#   set the version in src/BallPitAccess/Main.cs (MelonInfo), the READMEs and CHANGELOG.md, then
#   tools/release.sh (builds, checks the strings, rebuilds the READMEs, restages release/payload), then
#   git commit -am "Release 0.5.0" && git tag -a v0.5.0 -m v0.5.0 && git push --follow-tags
# CI cannot build the mod: it references the game's own assemblies (generated by MelonLoader), which
# are not redistributable, so the built DLL is committed in release/payload.
# The zip adds the official MelonLoader 0.7.3 x64 and Prism 0.18.3 downloads, checked by SHA-256.
# installer/BallPitAccessibilityInstaller.exe is built from the shared installer project
# (..\installer, build_installer.bat) and committed here; it always installs the latest release.
# Run it by hand (Actions > Release > Run workflow) to build the zip without releasing.
name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

env:
  MELONLOADER_VERSION: v0.7.3
  MELONLOADER_SHA256: 5b2b2f3d1cd42b59ec886c5bdc2663edae87a0097a4f4a8f58c0965a99dda416
  PRISM_VERSION: v0.18.3
  PRISM_SHA256: 13d3c9d1d524b0737cde261c6468845753e36b6c5c2637e7d26bfb8bf4d8783f
  TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0' }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against the mod's version
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/.*MelonInfo(typeof(BallPitAccess.Main), "BALL x PIT Access", "\([0-9.]*\)".*/\1/p' src/BallPitAccess/Main.cs)
          if [ "v$version" != "$TAG" ]; then
            echo "Tag $TAG does not match version $version in Main.cs." >&2
            exit 1
          fi
          grep -aq "$version" release/payload/Mods/BallPitAccess.dll || {
            echo "release/payload/Mods/BallPitAccess.dll is not version $version: run tools/release.sh and commit." >&2
            exit 1
          }

      - name: Check that the payload and the installer are there
        run: |
          test -f release/payload/Mods/BallPitAccess.dll
          test -f release/payload/BallPitAccess/README.html
          test -f installer/BallPitAccessibilityInstaller.exe

      - name: Release notes from this version's CHANGELOG section
        if: github.event_name == 'push'
        run: |
          version=${TAG#v}
          awk -v h="## $version" '$0 == h {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no '## $version' section." >&2; exit 1; }

      - name: Download MelonLoader and Prism
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dl
          gh release download "$MELONLOADER_VERSION" --repo LavaGang/MelonLoader --pattern MelonLoader.x64.zip --dir dl
          gh release download "$PRISM_VERSION" --repo ethindp/prism --pattern prism-windows-x64.zip --dir dl
          echo "$MELONLOADER_SHA256  dl/MelonLoader.x64.zip" | sha256sum -c -
          echo "$PRISM_SHA256  dl/prism-windows-x64.zip" | sha256sum -c -

      - name: Assemble the game folder layout
        run: |
          mkdir -p stage
          unzip -q dl/MelonLoader.x64.zip -d stage
          unzip -q dl/prism-windows-x64.zip 'dynamic/release/bin/prism.dll' 'LICENSES/*' NOTICE -d prism
          cp prism/dynamic/release/bin/prism.dll stage/
          mkdir -p stage/BallPitAccess/licenses/prism
          cp -r prism/LICENSES/. stage/BallPitAccess/licenses/prism/
          cp prism/NOTICE stage/BallPitAccess/licenses/prism/
          cp -r release/payload/. stage/
          test -f stage/version.dll
          test -f stage/MelonLoader/net6/MelonLoader.dll
          (cd stage && zip -qr "../BallPitAccess-$TAG.zip" .)
          unzip -l "BallPitAccess-$TAG.zip" | grep -v '/Dependencies/\|/net35/\|/net472/'

      - name: Keep the zip (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: BallPitAccess-build
          path: BallPitAccess-${{ env.TAG }}.zip

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            BallPitAccess-${{ github.ref_name }}.zip
            installer/BallPitAccessibilityInstaller.exe
          body_path: notes.md
